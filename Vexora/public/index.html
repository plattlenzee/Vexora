<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vexora AI</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at 50% -20%, #24134d 0%, transparent 45%),
        #07070b;
    color: white;
    min-height: 100vh;
}

/* NAVBAR */

.navbar {
    height: 72px;
    padding: 0 6%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    backdrop-filter: blur(15px);
}

.logo {
    font-size: 25px;
    font-weight: 800;
    letter-spacing: -1px;
}

.logo span {
    color: #9b6cff;
}

.nav-right {
    display: flex;
    align-items: center;
    gap: 12px;
}

.credits {
    padding: 9px 14px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    font-size: 13px;
    color: #d8d8df;
}

.avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg,#8b5cf6,#c084fc);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

/* HERO */

.hero {
    text-align: center;
    max-width: 900px;
    margin: 0 auto;
    padding: 100px 20px 60px;
}

.badge {
    display: inline-flex;
    padding: 8px 14px;
    border-radius: 100px;
    background: rgba(139,92,246,0.1);
    border: 1px solid rgba(139,92,246,0.25);
    color: #b99cff;
    font-size: 13px;
    margin-bottom: 28px;
}

h1 {
    font-size: clamp(45px, 8vw, 82px);
    line-height: 0.98;
    letter-spacing: -5px;
    margin-bottom: 25px;
}

.gradient {
    background: linear-gradient(90deg,#9b6cff,#d09cff);
    -webkit-background-clip: text;
    color: transparent;
}

.subtitle {
    color: #92929d;
    font-size: 17px;
    line-height: 1.6;
    max-width: 620px;
    margin: auto;
}

/* CREATE BOX */

.creator {
    max-width: 760px;
    margin: 35px auto 0;
    padding: 18px;
    border-radius: 22px;
    background: rgba(15,15,21,0.9);
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 30px 100px rgba(0,0,0,0.45);
    text-align: left;
}

textarea {
    width: 100%;
    height: 125px;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    color: white;
    font-size: 16px;
    font-family: inherit;
}

textarea::placeholder {
    color: #656570;
}

.creator-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 12px;
}

.tip {
    color: #666671;
    font-size: 12px;
}

.generate {
    border: none;
    background: linear-gradient(135deg,#8b5cf6,#a855f7);
    color: white;
    padding: 12px 20px;
    border-radius: 11px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

.generate:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(139,92,246,0.3);
}

.generate:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
}

/* PROJECTS */

.projects {
    max-width: 900px;
    margin: 30px auto 80px;
    padding: 0 20px;
    text-align: left;
}

.section-title {
    font-size: 20px;
    margin-bottom: 16px;
}

.project-card {
    padding: 25px;
    border-radius: 16px;
    background: #0f0f14;
    border: 1px solid rgba(255,255,255,0.07);
}

.project {
    padding: 18px;
    margin-bottom: 12px;
    background: #15151d;
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 12px;
}

.project:last-child {
    margin-bottom: 0;
}

.project-name {
    font-size: 16px;
    font-weight: bold;
}

.project-prompt {
    margin-top: 8px;
    color: #92929d;
    font-size: 14px;
    line-height: 1.5;
}

.project-date {
    margin-top: 10px;
    color: #666671;
    font-size: 11px;
}

/* GENERATING */

.loading {
    display: none;
    margin-top: 20px;
    color: #b99cff;
    font-size: 14px;
}

.dot {
    animation: blink 1.2s infinite;
}

@keyframes blink {
    0%,100% { opacity: .2; }
    50% { opacity: 1; }
}

/* BACKGROUND */

.bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
    opacity: 0.08;
}

.row {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
    width: max-content;
}

.row img {
    width: 260px;
    height: 150px;
    object-fit: cover;
    border-radius: 15px;
}

.row1 {
    transform: rotate(-3deg) translateX(-50px);
}

.row2 {
    transform: rotate(3deg) translateX(-150px);
}

/* MOBILE */

@media(max-width:600px) {

    .navbar {
        padding: 0 18px;
    }

    .hero {
        padding-top: 65px;
    }

    h1 {
        letter-spacing: -3px;
    }

    .subtitle {
        font-size: 15px;
    }

    .creator {
        margin-top: 30px;
    }

    .creator-bottom {
        align-items: flex-end;
    }

    .tip {
        max-width: 180px;
    }
}
</style>
</head>

<body>

<!-- BACKGROUND -->

<div class="bg">

    <div class="row row1">
        <img src="images/brookhaven.png">
        <img src="images/adoptme.png">
        <img src="images/rivals.png">
        <img src="images/mm2.png">
        <img src="images/brookhaven.png">
        <img src="images/adoptme.png">
    </div>

    <div class="row row2">
        <img src="images/mm2.png">
        <img src="images/rivals.png">
        <img src="images/adoptme.png">
        <img src="images/brookhaven.png">
        <img src="images/mm2.png">
        <img src="images/rivals.png">
    </div>

</div>


<!-- NAVBAR -->

<header class="navbar">

    <div class="logo">
        VEX<span>ORA</span>
    </div>

    <div class="nav-right">

        <div class="credits">
            ⚡ 100 crédits
        </div>

        <div class="avatar">
            V
        </div>

    </div>

</header>


<!-- HERO -->

<section class="hero">

    <div class="badge">
        ✦ VEXORA AI
    </div>

    <h1>
        Create your game.<br>
        <span class="gradient">Just imagine it.</span>
    </h1>

    <p class="subtitle">
        Décris le jeu que tu imagines.
        Vexora transformera ton idée
        en véritable projet.
    </p>


    <!-- CREATOR -->

    <div class="creator">

        <textarea
            id="prompt"
            placeholder="Décris le jeu que tu veux créer..."
        ></textarea>

        <div class="creator-bottom">

            <div class="tip">
                ⚡ Vexora AI · 100 crédits
            </div>

            <button
                class="generate"
                id="generateButton"
                onclick="generateGame()"
            >
                Générer →
            </button>

        </div>

        <div
            class="loading"
            id="loading"
        >
            Vexora réfléchit<span class="dot">...</span>
        </div>

    </div>

</section>


<!-- PROJECTS -->

<section class="projects">

    <h2 class="section-title">
        Mes projets
    </h2>

    <div class="project-card" id="projectList">

        <p style="color:#666671;font-size:14px;">
            Chargement des projets...
        </p>

    </div>

</section>


<script>

/*
    SERVEUR VEXORA
*/

const API_URL = "https://vexora-ai-pz4p.onrender.com";


/*
    GÉNÉRER UN PROJET
*/

async function generateGame() {

    const prompt =
        document.getElementById("prompt").value.trim();

    const loading =
        document.getElementById("loading");

    const button =
        document.getElementById("generateButton");


    if (prompt === "") {

        alert(
            "Décris d'abord le jeu que tu veux créer !"
        );

        return;
    }


    loading.style.display = "block";

    loading.innerHTML =
        'Vexora crée ton projet<span class="dot">...</span>';

    button.disabled = true;


    try {

        const response = await fetch(
            `${API_URL}/api/projects`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    name: "Mon projet",
                    prompt: prompt
                })
            }
        );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error || "Erreur serveur"
            );

        }


        loading.innerHTML =
            "✓ Projet créé avec succès !";

        document.getElementById("prompt").value = "";


        await loadProjects();


    } catch (error) {

        console.error(error);

        loading.innerHTML =
            "❌ Impossible de contacter Vexora.";

    }


    button.disabled = false;

}


/*
    CHARGER LES PROJETS
*/

async function loadProjects() {

    const container =
        document.getElementById("projectList");


    try {

        const response =
            await fetch(`${API_URL}/api/projects`);


        if (!response.ok) {

            throw new Error(
                "Impossible de charger les projets"
            );

        }


        const projects =
            await response.json();


        if (!projects.length) {

            container.innerHTML = `
                <p style="color:#666671;font-size:14px;">
                    Aucun projet pour le moment.
                    Ton premier projet apparaîtra ici.
                </p>
            `;

            return;
        }


        container.innerHTML =
            projects.map(project => `

                <div class="project">

                    <div class="project-name">
                        ${escapeHTML(project.name)}
                    </div>

                    <div class="project-prompt">
                        ${escapeHTML(project.prompt)}
                    </div>

                    <div class="project-date">
                        ${formatDate(project.createdAt)}
                    </div>

                </div>

            `).join("");


    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <p style="color:#666671;font-size:14px;">
                Impossible de charger les projets.
            </p>
        `;

    }

}


/*
    SÉCURITÉ
*/

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;

}


/*
    DATE
*/

function formatDate(date) {

    if (!date) return "";

    return new Date(date).toLocaleDateString(
        "fr-FR",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        }
    );

}


/*
    CHARGEMENT INITIAL
*/

loadProjects();

</script>

</body>
</html>
